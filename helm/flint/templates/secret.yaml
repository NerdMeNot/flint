{{- if not .Values.secrets.existingSecret }}
{{- /* Generate-once idiom: reuse existing values across upgrades so JWTs,
       agent tokens, and envelope-encrypted data stay valid. */}}
{{- $name := printf "%s-core" (include "flint.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $jwt := .Values.secrets.jwtSecret | default (dig "data" "jwtSecret" "" $existing | b64dec) | default (randAlphaNum 48) }}
{{- $internal := .Values.secrets.internalToken | default (dig "data" "internalToken" "" $existing | b64dec) | default (randAlphaNum 32) }}
{{- /* masterKey must be 64 hex chars (32 bytes): hex-encode 32 random ASCII chars. */}}
{{- $master := .Values.secrets.masterKey | default (dig "data" "masterKey" "" $existing | b64dec) | default (printf "%x" (randAlphaNum 32)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "flint.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ $jwt | quote }}
  internalToken: {{ $internal | quote }}
  masterKey: {{ $master | quote }}
{{- end }}
{{- if and (not .Values.database.existingSecret) .Values.database.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flint.fullname" . }}-db
  labels:
    {{- include "flint.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.database.password | quote }}
{{- end }}
