apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flint.fullname" . }}-config
  labels:
    {{- include "flint.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: 8080
      baseUrl: {{ .Values.server.baseUrl | default (printf "http://%s.%s.svc.cluster.local:8080" (include "flint.fullname" .) .Release.Namespace) | quote }}
      # jwt/masterKey come from env (FLINT_ overrides).

    database:
      host: {{ include "flint.dbHost" . | quote }}
      port: {{ .Values.database.port }}
      database: {{ .Values.database.database | quote }}
      user: {{ .Values.database.user | quote }}
      sslMode: {{ .Values.database.sslMode | quote }}
      autoMigrate: {{ .Values.database.autoMigrate }}

    engine:
      defaultPool: {{ .Values.engine.defaultPool | quote }}

    auth:
      adminUsers:
        {{- range .Values.auth.adminUsers }}
        - {{ . | quote }}
        {{- end }}
      defaultRole: {{ .Values.auth.defaultRole | quote }}
      jwt:
        sessionDuration: {{ .Values.auth.sessionDuration | quote }}

    storage:
      mode: {{ .Values.storage.mode | quote }}
      filesystem:
        path: {{ .Values.storage.filesystem.path | quote }}
      {{- if eq .Values.storage.mode "s3" }}
      s3:
        bucket: {{ required "storage.s3.bucket is required in s3 mode" .Values.storage.s3.bucket | quote }}
        region: {{ .Values.storage.s3.region | quote }}
        {{- with .Values.storage.s3.endpoint }}
        endpoint: {{ . | quote }}
        {{- end }}
      {{- end }}

    encryption:
      masterKeyVersion: 1

    products:
      ci:
        enabled: {{ .Values.products.ci.enabled }}
      workflows:
        enabled: {{ .Values.products.workflows.enabled }}
