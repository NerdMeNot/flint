{{- if .Values.postgresql.internal }}
# Evaluation-only single-replica Postgres. Production installs should use a
# managed Postgres and set database.host instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flint.fullname" . }}-db
  labels:
    {{- include "flint.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-db" (include "flint.fullname" .)) }}
  password: {{ .Values.database.password | default (dig "data" "password" "" $existing | b64dec) | default (randAlphaNum 24) | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flint.fullname" . }}-postgres
  labels:
    {{- include "flint.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "flint.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "flint.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "flint.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flint.fullname" . }}-db
                  key: password
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}]
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flint.fullname" . }}-postgres
  labels:
    {{- include "flint.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "flint.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
{{- end }}
