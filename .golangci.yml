run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/NerdMeNot/flint

issues:
  exclude-dirs:
    - vendor
    - web
