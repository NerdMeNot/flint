# Process Compose — run the full local mock stack with one command:
#
#   go tool task dev-up          (server + web, hot reload, health-gated, TUI)
#   go tool task dev-down        (stop a detached stack)
#
# or directly:
#   go run github.com/f1bonacc1/process-compose@v1.110.0 up
#
# Process Compose gives real dependency ordering (web waits until the API is
# actually healthy, not just started), restart
# on crash, multiplexed logs, and graceful shutdown of the whole tree on exit.
#
# NO database and NO Kubernetes — the server runs in mock mode (canned in-memory
# data). air rebuilds + restarts the server on any .go change (see .air.toml);
# bun's dev server hot-reloads the web.
version: "0.5"

processes:
  server:
    command: go run github.com/air-verse/air@v1.65.3
    # air builds ./cmd/server and runs it with --config config.local.yaml --mock.
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        port: "8080" # Process Compose's http_get.port is a STRING — an unquoted
        # 8080 doesn't populate it, so the probe would hit :80 and never pass.
        path: /api/v1/meta
      initial_delay_seconds: 3
      period_seconds: 1
      timeout_seconds: 2
      # Generous: the very first `go run air` cold-compiles air AND the server,
      # which can take a couple minutes before :8080 answers.
      failure_threshold: 300
    availability:
      restart: on_failure
      backoff_seconds: 2

  web:
    command: bun run dev
    working_dir: web
    environment:
      - FLINT_BACKEND_URL=http://localhost:8080
    # Don't start the web dev server until the API answers — avoids the first
    # page load racing air's initial compile ("fetch failed").
    depends_on:
      server:
        condition: process_healthy
    availability:
      restart: on_failure
      backoff_seconds: 2
