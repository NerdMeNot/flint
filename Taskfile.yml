version: '3'

vars:
  BINS: server worker agent controller flint syncd
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  LDFLAGS: -X main.version={{.VERSION}} -X main.commit={{.COMMIT}}
  # air (live reload) pinned + run project-locally — no global install, no go.mod
  # tool directive (its dep tree would bloat the module). Config: .air.toml.
  AIR: go run github.com/air-verse/air@v1.65.3
  # Process Compose (local process orchestrator) — same project-local pattern.
  # Config: process-compose.yaml.
  PC: go run github.com/f1bonacc1/process-compose@v1.110.0

tasks:
  default:
    desc: Show available tasks
    cmds:
      - go tool task --list
    silent: true

  # --- Build ---

  build:
    desc: "Build a single binary (usage: task build BIN=server)"
    cmds:
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o bin/{{.BIN}} ./cmd/{{.BIN}}
    requires:
      vars: [BIN]

  build-all:
    desc: Build all binaries
    cmds:
      - for: { var: BINS, split: " " }
        task: build
        vars: { BIN: "{{.ITEM}}" }

  build-web:
    desc: Build the web frontend
    dir: web
    cmds:
      - bun run build

  build-everything:
    desc: Build all binaries + web frontend
    cmds:
      - task: build-all
      - task: build-web

  # --- Test ---

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test-short:
    desc: Run tests in short mode (skip slow/integration tests)
    cmds:
      - go test -short ./...

  test-verbose:
    desc: Run tests with verbose output
    cmds:
      - go test -v ./...

  test-race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | grep total
      - go tool cover -html=coverage.out -o coverage.html

  test-all:
    desc: Run Go tests + frontend build
    cmds:
      - task: test
      - task: build-web

  # --- Code quality ---

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run

  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  # --- Code generation ---

  generate:
    desc: Run all code generation (proto, sqlc, CRD manifests)
    cmds:
      - task: proto-gen
      - task: sqlc-gen
      - task: crd-gen

  proto-gen:
    desc: Generate Go code from protobuf definitions
    cmds:
      - buf dep update
      - buf lint
      - buf generate
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.gen.yaml
    generates:
      - protogen/**/*.go

  proto-lint:
    desc: Lint protobuf definitions
    cmds:
      - buf lint

  proto-breaking:
    desc: Check for breaking protobuf changes against main branch
    cmds:
      - buf breaking --against '.git#branch=main'

  sqlc-gen:
    desc: Generate type-safe Go from SQL queries
    cmds:
      - sqlc generate

  crd-gen:
    desc: Generate CRD YAML manifests from Go types
    cmds:
      - mkdir -p helm/crds
      - go run sigs.k8s.io/controller-tools/cmd/controller-gen crd paths="./internal/core/crd/..." output:crd:artifacts:config=helm/crds

  # --- Frontend ---

  web-dev:
    desc: Start the web frontend dev server
    dir: web
    cmds:
      - bun run dev

  web-build:
    desc: Build the web frontend for production
    dir: web
    cmds:
      - bun run build

  web-install:
    desc: Install web frontend dependencies
    dir: web
    cmds:
      - bun install

  web-typecheck:
    desc: Run TypeScript type checking on the frontend
    dir: web
    cmds:
      - bunx tsc --noEmit

  # --- Database ---

  migrate-up:
    desc: Run database migrations
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose -dir internal/core/dbkit/migrations postgres "{{.DATABASE_URL}}" up
    requires:
      vars: [DATABASE_URL]

  migrate-down:
    desc: Roll back last migration
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose -dir internal/core/dbkit/migrations postgres "{{.DATABASE_URL}}" down
    requires:
      vars: [DATABASE_URL]

  migrate-create:
    desc: "Create a new migration (usage: task migrate-create NAME=add_widgets)"
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose -dir internal/core/dbkit/migrations create {{.NAME}} sql
    requires:
      vars: [NAME]

  migrate-status:
    desc: Show migration status
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose -dir internal/core/dbkit/migrations postgres "{{.DATABASE_URL}}" status
    requires:
      vars: [DATABASE_URL]

  # --- Development ---

  dev:
    desc: Start the server in development mode
    cmds:
      - go run ./cmd/server --config config.yaml --mode all

  dev-worker:
    desc: Start the worker in development mode
    cmds:
      - go run ./cmd/worker --config config.yaml

  dev-all:
    desc: Start server + web frontend dev server
    deps:
      - dev
      - web-dev

  dev-db:
    desc: Start a local Postgres for development (Podman)
    cmds:
      - podman run -d --name flint-dev-db -p 5432:5432 -e POSTGRES_DB=flint -e POSTGRES_USER=flint -e POSTGRES_PASSWORD=flint postgres:17-alpine
      - echo "waiting for postgres..."; until podman exec flint-dev-db pg_isready -U flint >/dev/null 2>&1; do sleep 1; done; echo "postgres ready"
    status:
      - podman container exists flint-dev-db

  dev-db-stop:
    desc: Stop and remove the local dev Postgres
    cmds:
      - podman rm -f flint-dev-db

  dev-local:
    desc: Run the full stack locally — steps dispatch to your local Kubernetes cluster
    deps:
      - dev-db
    cmds:
      - DATABASE_URL=postgres://flint:flint@localhost:5432/flint?sslmode=disable task migrate-up
      - |
        go run ./cmd/worker --config config.local.yaml &
        WORKER_PID=$!
        trap "kill $WORKER_PID 2>/dev/null" EXIT
        go run ./cmd/server --config config.local.yaml --mode all

  dev-mock:
    desc: Run the server in mock mode with hot reload (air) — canned in-memory data, NO database/Kubernetes (pair with `FLINT_BACKEND_URL=http://localhost:8080 task web-dev`)
    cmds:
      - "{{.AIR}}"

  dev-up:
    desc: Run the full mock stack (server + web) under Process Compose — hot reload, health-gated startup, one TUI. NO database or Kubernetes.
    cmds:
      - "{{.PC}} up"

  dev-down:
    desc: Stop a detached Process Compose stack (started with `{{.PC}} up -D`)
    cmds:
      - "{{.PC}} down"

  dev-mock-all:
    desc: Run server (mock mode, hot reload) + web dev server together — full UI, NO database or Kubernetes (shell fallback for dev-up)
    cmds:
      # air rebuilds + restarts the server on any .go change (run via `go run
      # <pkg>@version` — no global install, no go.mod pollution). Wait until the
      # API answers before starting the web dev server, so the first page load
      # never races air's initial build ("fetch failed").
      - |
        {{.AIR}} &
        SERVER_PID=$!
        trap "kill $SERVER_PID 2>/dev/null" EXIT
        printf 'waiting for mock API on :8080'
        until curl -sf http://localhost:8080/api/v1/meta >/dev/null 2>&1; do printf '.'; sleep 0.3; done
        echo ' ready'
        cd web && FLINT_BACKEND_URL=http://localhost:8080 bun run dev

  # --- Docker ---

  docker:
    desc: "Build a Docker image (usage: task docker TARGET=server)"
    cmds:
      - docker build --target {{.TARGET}} -t ghcr.io/nerdmenot/flint-{{.TARGET}}:{{.VERSION}} -t ghcr.io/nerdmenot/flint-{{.TARGET}}:latest --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} .
    requires:
      vars: [TARGET]

  docker-all:
    desc: Build all Docker images
    cmds:
      - for: { var: DOCKER_TARGETS, split: " " }
        task: docker
        vars: { TARGET: "{{.ITEM}}" }
    vars:
      DOCKER_TARGETS: server worker controller agent

  # --- Dependencies ---

  deps:
    desc: Download all dependencies (Go + frontend)
    cmds:
      - go mod download
      - task: web-install

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  # --- Clean ---

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.out coverage.html
      - rm -rf web/dist web/node_modules/.vite
      - go clean -cache -testcache
