version: '3'

vars:
  BINS: server worker agent controller flint
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  LDFLAGS: -X main.version={{.VERSION}} -X main.commit={{.COMMIT}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - go tool task --list
    silent: true

  # --- Build ---

  build:
    desc: "Build a single binary (usage: task build BIN=server)"
    cmds:
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o bin/{{.BIN}} ./cmd/{{.BIN}}
    requires:
      vars: [BIN]

  build-all:
    desc: Build all binaries
    cmds:
      - for: { var: BINS, split: " " }
        task: build
        vars: { BIN: "{{.ITEM}}" }

  # --- Test ---

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  test-short:
    desc: Run tests in short mode (skip slow/integration tests)
    cmds:
      - go test -short ./...

  test-verbose:
    desc: Run tests with verbose output
    cmds:
      - go test -v ./...

  test-race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | grep total
      - go tool cover -html=coverage.out -o coverage.html

  # --- Code quality ---

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run

  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  # --- Code generation ---

  generate:
    desc: Run all code generation (sqlc, CRD manifests)
    cmds:
      - task: sqlc-gen
      - task: crd-gen

  sqlc-gen:
    desc: Generate type-safe Go from SQL queries
    cmds:
      - sqlc generate

  crd-gen:
    desc: Generate CRD YAML manifests from Go types
    cmds:
      - mkdir -p helm/crds
      - go run sigs.k8s.io/controller-tools/cmd/controller-gen crd paths="./internal/crd/..." output:crd:artifacts:config=helm/crds

  # --- Database ---

  migrate-up:
    desc: Run database migrations
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose -dir internal/dbkit/migrations postgres "{{.DATABASE_URL}}" up
    requires:
      vars: [DATABASE_URL]

  migrate-down:
    desc: Roll back last migration
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose -dir internal/dbkit/migrations postgres "{{.DATABASE_URL}}" down
    requires:
      vars: [DATABASE_URL]

  migrate-create:
    desc: "Create a new migration (usage: task migrate-create NAME=add_widgets)"
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose -dir internal/dbkit/migrations create {{.NAME}} sql
    requires:
      vars: [NAME]

  migrate-status:
    desc: Show migration status
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose -dir internal/dbkit/migrations postgres "{{.DATABASE_URL}}" status
    requires:
      vars: [DATABASE_URL]

  # --- Development ---

  dev:
    desc: Start the server in development mode
    cmds:
      - go run ./cmd/server --config config.yaml --mode all

  dev-worker:
    desc: Start the worker in development mode
    cmds:
      - go run ./cmd/worker --config config.yaml

  # --- Docker ---

  docker:
    desc: "Build a Docker image (usage: task docker TARGET=server)"
    cmds:
      - docker build --target {{.TARGET}} -t ghcr.io/nerdmenot/flint-{{.TARGET}}:{{.VERSION}} -t ghcr.io/nerdmenot/flint-{{.TARGET}}:latest --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} .
    requires:
      vars: [TARGET]

  docker-all:
    desc: Build all Docker images
    cmds:
      - for: { var: DOCKER_TARGETS, split: " " }
        task: docker
        vars: { TARGET: "{{.ITEM}}" }
    vars:
      DOCKER_TARGETS: server worker controller agent

  # --- Dependencies ---

  deps:
    desc: Download dependencies
    cmds:
      - go mod download

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  # --- Clean ---

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.out coverage.html
      - go clean -cache -testcache
