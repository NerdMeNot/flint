version: '3'

vars:
  BINS: flint flint-agent
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  LDFLAGS: -X github.com/NerdMeNot/flint/internal/version.Version={{.VERSION}} -X github.com/NerdMeNot/flint/internal/version.Commit={{.COMMIT}}
  # The local sim stack (task dev-sim) runs under mprocs (config: mprocs.yaml),
  # which hot-reloads the Go binaries via air (.air.server.toml/.air.worker.toml,
  # pinned via `go run <pkg>@<ver>`). mprocs is a Rust binary — install once with
  # `brew install mprocs` (or `cargo install mprocs`).

tasks:
  default:
    desc: Show available tasks
    cmds:
      - go tool task --list
    silent: true

  # --- Build ---

  build:
    desc: "Build a single binary (usage: task build BIN=flint)"
    cmds:
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o bin/{{.BIN}} ./cmd/{{.BIN}}
    requires:
      vars: [BIN]

  build-all:
    desc: Build both binaries (flint control plane + CLI, flint-agent machine daemon)
    cmds:
      - for: { var: BINS, split: " " }
        task: build
        vars: { BIN: "{{.ITEM}}" }

  build-agent-linux:
    desc: Cross-compile the linux flint-agent (what machines actually run)
    cmds:
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="{{.LDFLAGS}}" -o bin/flint-agent-linux-amd64 ./cmd/flint-agent
      - GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="{{.LDFLAGS}}" -o bin/flint-agent-linux-arm64 ./cmd/flint-agent

  build-web:
    desc: Build the web frontend
    dir: web
    cmds:
      - bun run build

  # --- Test ---

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test-short:
    desc: Run tests in short mode (skip slow/integration tests)
    cmds:
      - go test -short ./...

  test-race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | grep total
      - go tool cover -html=coverage.out -o coverage.html

  test-all:
    desc: Run Go tests + frontend build
    cmds:
      - task: test
      - task: build-web

  # --- Code quality ---

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run

  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  # --- Code generation ---

  generate:
    desc: Run all code generation (proto, sqlc)
    cmds:
      - task: proto-gen
      - task: sqlc-gen

  proto-gen:
    desc: Generate Go code from protobuf definitions
    cmds:
      - buf dep update
      - buf lint
      - buf generate
    sources:
      - proto/**/*.proto
      - buf.yaml
      - buf.gen.yaml
    generates:
      - protogen/**/*.go

  proto-lint:
    desc: Lint protobuf definitions
    cmds:
      - buf lint

  proto-breaking:
    desc: Check for breaking protobuf changes against main branch
    cmds:
      - buf breaking --against '.git#branch=main'

  sqlc-gen:
    desc: Generate type-safe Go from SQL queries
    cmds:
      - sqlc generate

  # --- Frontend ---

  web-dev:
    desc: Start the web frontend dev server
    dir: web
    cmds:
      - bun run dev

  web-install:
    desc: Install web frontend dependencies
    dir: web
    cmds:
      - bun install

  web-typecheck:
    desc: Run TypeScript type checking on the frontend
    dir: web
    cmds:
      - bunx tsc --noEmit

  # --- Database ---

  migrate-up:
    desc: Run database migrations (vendored goose via the flint CLI)
    cmds:
      - go run ./cmd/flint dev migrate up --dsn "{{.DATABASE_URL}}"
    requires:
      vars: [DATABASE_URL]

  migrate-down:
    desc: Roll back last migration (vendored goose via the flint CLI)
    cmds:
      - go run ./cmd/flint dev migrate down --dsn "{{.DATABASE_URL}}"
    requires:
      vars: [DATABASE_URL]

  migrate-create:
    # Scaffolds a new migration file via the goose CLI. Pre-live the convention is
    # to fold schema changes into 001_initial_schema.sql instead (see CLAUDE.md), so
    # this is rarely needed; it requires the goose binary on PATH because file
    # scaffolding isn't exposed by the embedded library path.
    desc: "Create a new migration (usage: task migrate-create NAME=add_widgets)"
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose -dir internal/core/dbkit/migrations create {{.NAME}} sql
    requires:
      vars: [NAME]

  migrate-status:
    desc: Show migration status (vendored goose via the flint CLI)
    cmds:
      - go run ./cmd/flint dev migrate status --dsn "{{.DATABASE_URL}}"
    requires:
      vars: [DATABASE_URL]

  # --- Development ---

  dev-db:
    desc: Start a local Postgres for development (Podman)
    cmds:
      - podman run -d --name flint-dev-db -p 5432:5432 -e POSTGRES_DB=flint -e POSTGRES_USER=flint -e POSTGRES_PASSWORD=flint postgres:17-alpine
      - echo "waiting for postgres..."; until podman exec flint-dev-db pg_isready -U flint >/dev/null 2>&1; do sleep 1; done; echo "postgres ready"
    status:
      - podman container exists flint-dev-db

  dev-db-stop:
    desc: Stop and remove the local dev Postgres
    cmds:
      - podman rm -f flint-dev-db

  dev-local:
    desc: Run the control plane locally (single process, embedded dispatch)
    deps:
      - dev-db
    cmds:
      - DATABASE_URL=postgres://flint:flint@localhost:5432/flint?sslmode=disable task migrate-up
      - go run ./cmd/flint server --config config.local.yaml --mode all

  dev-agent:
    desc: Join a REAL flint-agent (bundled containerd, real containers) to the local server — runs dind-style in a privileged Podman container; on macOS it lives inside the podman-machine Linux VM. Requires `task dev-local` running in another terminal.
    cmds:
      - GOOS=linux GOARCH={{ARCH}} CGO_ENABLED=0 go build -trimpath -ldflags="{{.LDFLAGS}}" -o bin/flint-agent-linux ./cmd/flint-agent
      # Mint (or rotate) the standard pool's join token, creating the pool if
      # this is a fresh database.
      - |
        TOKEN=$(go run ./cmd/flint dev join-token standard --config config.local.yaml)
        # cgroup-v2 "no internal processes" dance is dind-only; real machines
        # have systemd owning the hierarchy. Bundle (containerd+runc) is cached
        # in a named volume across restarts; agent state is per-invocation.
        podman volume rm -f flint-dev-agent-data >/dev/null 2>&1 || true
        exec podman run --rm -it --privileged --name flint-dev-agent \
          -v "$PWD/bin/flint-agent-linux:/usr/local/bin/flint-agent:ro" \
          -v "$PWD/scripts/bundle-runtime.sh:/bundle-runtime.sh:ro" \
          -v flint-dev-agent-bundle:/var/lib/flint-agent/bin \
          -v flint-dev-agent-data:/var/lib/flint-agent \
          docker.io/library/buildpack-deps:bookworm-curl sh -c '
            set -eu
            if [ -f /sys/fs/cgroup/cgroup.subtree_control ]; then
              mkdir -p /sys/fs/cgroup/init
              while read -r p; do echo "$p" > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true; done < /sys/fs/cgroup/cgroup.procs
              echo "+cpu +memory +pids +io" > /sys/fs/cgroup/cgroup.subtree_control 2>/dev/null || true
            fi
            command -v iptables >/dev/null 2>&1 || { apt-get update -q >/dev/null && apt-get install -y -q iptables >/dev/null; }
            { /var/lib/flint-agent/bin/containerd --version >/dev/null 2>&1 && [ -x /var/lib/flint-agent/bin/cni/bridge ]; } || sh /bundle-runtime.sh /var/lib/flint-agent/bin
            exec /usr/local/bin/flint-agent daemon \
              --server host.containers.internal:9443 \
              --token '"$TOKEN"' --runtime containerd --insecure \
              --data-dir /var/lib/flint-agent'

  _air-bin:
    internal: true
    # Install the pinned air binary to tmp/bin so mprocs can run it DIRECTLY (a
    # `go run air` wrapper swallows the stop signal and orphans the built server —
    # see mprocs.yaml). `go install pkg@version` ignores the local module/vendor.
    cmds:
      - GOBIN="{{.ROOT_DIR}}/tmp/bin" go install github.com/air-verse/air@v1.65.3
    status:
      - test -x tmp/bin/air

  _free-ports:
    internal: true
    # Kill anything still holding the app/web ports — orphans from a previous run
    # that ended abruptly (terminal closed, SIGKILL) or a process mprocs couldn't
    # signal cleanly (e.g. vite under bun). Makes a restart always bind cleanly.
    # for-loop with a guarded substitution: lsof exits 1 when nothing matches, and
    # Task runs commands with errexit — `pids=$(lsof…)` would fail the task before
    # the trailing `|| true`. The loop sidesteps that and is portable (no xargs -r).
    # Only 8080/3000 — never 5432 (that's the Podman Postgres we keep).
    cmds:
      - 'for p in $(lsof -ti tcp:8080 tcp:3000 2>/dev/null || true); do kill "$p" 2>/dev/null || true; done'

  dev-sim:
    desc: Run the full local sim stack (Postgres + seed + server + dispatch + web) under mprocs — REAL engine, simulated step execution (no machines needed), hot reload, per-process panes. Needs mprocs (`brew install mprocs`). Log in as admin@flint.dev / flintdev123.
    deps:
      - dev-db
      - _air-bin
      - _free-ports
    cmds:
      # Clear any stale seed sentinel so server/worker wait for THIS run's seed.
      - rm -f tmp/.seed-done
      # Hand off to mprocs: seed (one-shot; migrates + seeds) → server + worker + web.
      - mprocs

  dev-seed:
    desc: Re-seed the local sim database (idempotent — replaces prior seed data)
    deps:
      - dev-db
    cmds:
      - go run ./cmd/flint dev seed --config config.local.yaml

  dev-down:
    desc: Tear down the local sim stack — stop Postgres and free any stray dev ports (8080/3000)
    cmds:
      - task: dev-db-stop
      - task: _free-ports

  # --- Docker ---

  docker:
    desc: "Build a Docker image (usage: task docker TARGET=flint)"
    cmds:
      - docker build --target {{.TARGET}} -t ghcr.io/nerdmenot/{{.TARGET}}:{{.VERSION}} -t ghcr.io/nerdmenot/{{.TARGET}}:latest --build-arg VERSION={{.VERSION}} --build-arg COMMIT={{.COMMIT}} .
    requires:
      vars: [TARGET]

  docker-all:
    desc: Build all Docker images
    cmds:
      - for: { var: DOCKER_TARGETS, split: " " }
        task: docker
        vars: { TARGET: "{{.ITEM}}" }
    vars:
      DOCKER_TARGETS: flint flint-agent

  # --- Dependencies ---

  deps:
    desc: Download all dependencies (Go + frontend)
    cmds:
      - go mod download
      - task: web-install

  tidy:
    desc: Tidy go.mod
    cmds:
      - go mod tidy

  # --- Clean ---

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.out coverage.html
      - rm -rf web/dist web/node_modules/.vite
      - go clean -cache -testcache
