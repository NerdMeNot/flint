# Flint configuration
# Copy to config.yaml and adjust for your environment.
# All values can be overridden with FLINT_ env vars:
#   server.port → FLINT_SERVER_PORT

server:
  port: 8080
  # AgentService gRPC listener — the flint-agent control channel
  # (registration, heartbeats, work claiming, logs).
  grpcPort: 9443
  baseUrl: http://localhost:8080

database:
  host: localhost
  port: 5432
  database: flint
  user: flint
  password: flint
  sslMode: disable
  maxConns: 10
  minConns: 2

engine:
  defaultPool: standard   # machine pool for jobs that set no runner:
  sweepInterval: 5m       # observer sweep interval (min: 30s, default: 5m)
  runRetentionDays: 90    # delete finished runs after N days (negative = keep forever)

# Compute rates behind cost-per-run estimates (GET /runs/:id/cost and the run
# detail UI). Defaults approximate on-demand cloud pricing.
costs:
  cpuCoreHour: 0.0416   # USD per vCPU-hour
  memoryGbHour: 0.0046  # USD per GB-hour

auth:
  adminUsers: []          # emails that always get org_admin (bootstrap)
  defaultRole: viewer     # fallback role when no Casbin policy matches
  oidc:
    issuerUrl: ""
    clientId: ""
    clientSecret: ""
  saml:
    enabled: false
    metadataUrl: ""
    entityId: ""           # defaults to {baseUrl}/auth/saml/metadata
    certFile: ""           # optional SP signing certificate PEM
    keyFile: ""            # optional SP signing private key PEM
  jwt:
    secret: "change-me-to-a-32-byte-secret!!"
    sessionDuration: 24h

# Object/log storage. filesystem suits single-node installs; s3 is the
# production choice and also enables per-step artifacts, cache, and the S3
# workspace mode (the worker injects the bucket into step pods).
storage:
  mode: filesystem
  filesystem:
    path: /tmp/flint-logs
  # s3:
  #   bucket: flint-artifacts
  #   region: us-east-1
  #   endpoint: ""   # optional: S3-compatible stores (MinIO, R2) — path-style

# Compute providers — the machine sources pools draw from. DB/API-managed
# (Settings → Providers); this OPTIONAL block bootstraps entries by name at
# startup for IaC installs. The built-in "static" provider (bring-your-own
# machines joining via pool tokens) always exists. Credentials never live in
# this file — use the provider's ambient chain (instance role / env) or set
# them via the API.
# providers:
#   - name: aws-us-east-1
#     type: aws
#     region: us-east-1
#     subnetIds: [subnet-abc123]
#     securityGroupIds: [sg-abc123]
#     instanceProfile: flint-machine

# Forge connections (GitHub, GitLab, Bitbucket) are configured per-org
# via the UI and stored in the database — not in this config file.

encryption:
  # REQUIRED for the server: forge credentials, SSO config, and secrets are
  # envelope-encrypted with this key. Generate with: openssl rand -hex 32
  masterKey: ""  # hex-encoded 32-byte key
  masterKeyVersion: 1

# Products — which top-level sections the unified UI exposes. CI and Workflows
# default on; Load Testing has no backend yet (shown as "Coming Soon").
# The UI reads this via GET /api/v1/capabilities.
products:
  ci:
    enabled: true
  workflows:
    enabled: true
