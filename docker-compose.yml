# Flint local development stack.
# Start:  docker compose up
# Reset:  docker compose down -v

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flint
      POSTGRES_USER: flint
      POSTGRES_PASSWORD: flint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flint"]
      interval: 2s
      timeout: 3s
      retries: 10

  # The whole control plane: API + webhooks + embedded dispatch loop in ONE
  # process (--mode all). Migrations apply automatically on startup.
  server:
    build:
      context: .
      target: flint
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.compose.yaml:/etc/flint/config.yaml:ro
      - logs:/tmp/flint-logs
    environment:
      # Simulated step execution — try Flint without any machines. Remove this
      # (and join a flint-agent machine) for real step execution.
      FLINT_EXECUTOR: sim
      # Demo mode: a stub forge serves a canned pipeline so you can create a
      # project and trigger runs without connecting GitHub. Remove for real use.
      FLINT_DEMO: "1"
    command: ["flint", "server", "--config", "/etc/flint/config.yaml", "--mode", "all"]

volumes:
  pgdata:
  logs:
