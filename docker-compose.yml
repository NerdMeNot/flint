# Flint local development stack.
# Start:  docker compose up
# Reset:  docker compose down -v

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flint
      POSTGRES_USER: flint
      POSTGRES_PASSWORD: flint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flint"]
      interval: 2s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      target: server
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/etc/flint/config.yaml:ro
      - logs:/tmp/flint-logs
    command: ["flint-server", "--config", "/etc/flint/config.yaml", "--mode", "all"]

  worker:
    build:
      context: .
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config.yaml:/etc/flint/config.yaml:ro
    command: ["flint-worker", "--config", "/etc/flint/config.yaml"]

volumes:
  pgdata:
  logs:
