syntax = "proto3";

package workspace.v1;

option go_package = "github.com/NerdMeNot/flint/protogen/workspace/v1;workspacev1";

import "buf/validate/validate.proto";

// WorkspaceService provides a shared filesystem for all steps within a single
// pipeline run. It runs as a dedicated pod per run, accessible to all step
// pods within the cluster via a ClusterIP service.
//
// All paths are relative, forward-slash separated, and validated server-side
// against the workspace root to prevent path traversal.
//
// Authentication is enforced via the x-flint-ws-token metadata header on
// every call. The token is the run ID injected into all step pods at dispatch.
service WorkspaceService {
  // Put streams file content to the workspace. The first message must contain
  // the destination path; all subsequent messages carry content chunks.
  rpc Put(stream PutRequest) returns (PutResponse);

  // Get streams file content from the workspace.
  // Returns NOT_FOUND if the path does not exist.
  rpc Get(GetRequest) returns (stream GetResponse);

  // Stat returns metadata for a path.
  // Returns NOT_FOUND if the path does not exist.
  rpc Stat(StatRequest) returns (StatResponse);

  // ReadDir lists entries directly under a directory.
  rpc ReadDir(ReadDirRequest) returns (ReadDirResponse);

  // MkdirAll creates a directory and all required parents.
  // It is not an error if the directory already exists.
  rpc MkdirAll(MkdirAllRequest) returns (MkdirAllResponse);

  // Remove deletes a file or empty directory.
  // Returns NOT_FOUND if the path does not exist.
  rpc Remove(RemoveRequest) returns (RemoveResponse);

  // GetManifest returns the server's current file manifest. Agents use this
  // to compute the diff before syncing — only changed files are transferred.
  rpc GetManifest(GetManifestRequest) returns (GetManifestResponse);
}

// ─────────────────────────────────────────────
// Put
// ─────────────────────────────────────────────

// PutRequest is used in the client-streaming Put RPC.
// The first message sent by the client MUST use the `path` field to declare
// the destination. All subsequent messages MUST use the `chunk` field.
message PutRequest {
  oneof data {
    // path is the destination path, sent as the first and only path message.
    string path = 1;
    // chunk is a slice of file content. May be sent zero or more times.
    bytes chunk = 2;
  }
}

// PutResponse is returned after the full file has been received.
message PutResponse {
  // bytes_written is the total number of content bytes stored.
  int64 bytes_written = 1;
}

// ─────────────────────────────────────────────
// Get
// ─────────────────────────────────────────────

message GetRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
}

// GetResponse carries one chunk of file content.
message GetResponse {
  bytes chunk = 1;
}

// ─────────────────────────────────────────────
// Stat
// ─────────────────────────────────────────────

message StatRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
}

message StatResponse {
  string name         = 1;
  int64  size         = 2;
  int64  mod_time_unix = 3; // Unix timestamp seconds
  bool   is_dir       = 4;
}

// ─────────────────────────────────────────────
// ReadDir
// ─────────────────────────────────────────────

message ReadDirRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
}

message ReadDirResponse {
  repeated DirEntry entries = 1;
}

message DirEntry {
  string name   = 1;
  bool   is_dir = 2;
  int64  size   = 3;
}

// ─────────────────────────────────────────────
// MkdirAll
// ─────────────────────────────────────────────

message MkdirAllRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
}

message MkdirAllResponse {}

// ─────────────────────────────────────────────
// Remove
// ─────────────────────────────────────────────

message RemoveRequest {
  string path = 1 [(buf.validate.field).string.min_len = 1];
}

message RemoveResponse {}

// ─────────────────────────────────────────────
// GetManifest
// ─────────────────────────────────────────────

message GetManifestRequest {}

// ManifestEntry describes a single file tracked by the workspace agent.
message ManifestEntry {
  string path       = 1; // relative, forward-slash path
  string hash       = 2; // xxh3 hex of file content (computed by server on Put)
  int64  size       = 3;
  int64  mtime_unix = 4; // Unix seconds
}

// GetManifestResponse contains all entries in the current workspace.
// For typical CI workspaces (< 50k files) this fits comfortably in one message.
message GetManifestResponse {
  repeated ManifestEntry entries = 1;
  // version is a monotonically increasing counter incremented on every Put or
  // Remove. Agents can skip SyncIn entirely when their cached version matches.
  int64 version = 2;
}
