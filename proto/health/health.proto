syntax = "proto3";

package health;

option go_package = "github.com/NerdMeNot/flint/protogen/health;health";

// HealthService provides health check endpoints for the gRPC server.
service HealthService {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }
  ServingStatus status = 1;
}
