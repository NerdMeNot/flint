# Mockery config for internal/testutil/mocks.
#
# These mocks were previously generated by an ad-hoc local mockery install with
# nothing recording how. That made the Querier mock a hand-edit hazard: adding
# one sqlc query broke every package that mocks db.Querier, with no supported
# way to regenerate. Mockery is now vendored via go.mod's `tool` directive
# (pinned to the version that produced the committed files, so regeneration is a
# no-op until an interface actually changes) and driven by this file.
#
# Regenerate with: task mocks
quiet: false
disable-version-string: false
with-expecter: false
dir: internal/testutil/mocks
outpkg: mocks
mockname: "{{.InterfaceName}}"
filename: "mock_{{ .InterfaceName | snakecase }}.go"

packages:
  github.com/NerdMeNot/flint/internal/core/engine:
    interfaces:
      Engine:
  github.com/NerdMeNot/flint/internal/core/db:
    interfaces:
      Querier:
      Pool:
  github.com/NerdMeNot/flint/internal/platform/auth:
    interfaces:
      OIDCAuth:
      SAMLAuth:
      Sessions:
  github.com/NerdMeNot/flint/internal/platform/server:
    interfaces:
      LogStream:
  github.com/NerdMeNot/flint/pkg/forge:
    interfaces:
      ForgeProvider:
  github.com/NerdMeNot/flint/pkg/logsink:
    interfaces:
      LogSink:
  github.com/NerdMeNot/flint/pkg/secret:
    interfaces:
      SecretStore:
