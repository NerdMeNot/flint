# air — live reload for the Flint server in the local sim stack (task dev-sim).
#
# Runs the REAL server against the seeded local Postgres (no --mock). On any .go
# change air rebuilds ./cmd/server and restarts it; the web dev server re-fetches
# once the API is back. FLINT_DEMO is set by mprocs to drive the demo banner.
# Invoked via `go run <pkg>@<version>` (pinned, no global install).
root = "."
tmp_dir = "tmp/server"

[build]
  cmd = "go build -o ./tmp/server/flint-server ./cmd/server"
  bin = "./tmp/server/flint-server"
  args_bin = ["--config", "config.local.yaml", "--mode", "all"]
  include_ext = ["go"]
  exclude_dir = ["web", "tmp", "bin", "vendor", "node_modules", "_reference", "docs", ".git", "helm", "testdata"]
  exclude_regex = ["_test\\.go"]
  delay = 800          # ms to debounce rapid saves
  stop_on_error = true # don't run a binary that failed to build
  # Shutdown hygiene: on rebuild AND on receiving a stop signal, interrupt the
  # built binary first (SIGINT) and wait kill_delay before SIGKILL, so air always
  # reaps its child — no orphaned server left holding :8080 after the stack stops.
  send_interrupt = true
  kill_delay = "2s"

[misc]
  clean_on_exit = true
