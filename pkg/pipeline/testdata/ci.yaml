triggers:
  pull_request:
    branches: [main]

  push:
    branches: [main, "feature/**"]
    paths: ["src/**", "go.sum"]

  manual:
    inputs:
      - name: skip_tests
        type: boolean
        default: "false"
        description: Skip the test suite

steps:
  - name: deps
    image: golang:1.23
    run: go mod download

  - name: lint
    image: golangci/golangci-lint:v1.62
    dependsOn: [deps]
    run: golangci-lint run ./...
    continueOnError: true

  - name: test
    image: golang:1.23
    dependsOn: [deps]
    if: "${{ inputs.skip_tests == 'false' }}"
    run: go test -race ./...
    services:
      - name: postgres
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_PASSWORD: test
    retry:
      attempts: 2
      delay: 5s

  - name: build
    image: golang:1.23
    dependsOn: [deps]
    run: go build -o bin/server ./cmd/server
    cache:
      key: "go-${{ hashFiles('go.sum') }}"
      paths: [/root/go/pkg/mod]

  - name: integration-test
    image: golang:1.23
    dependsOn: [build]
    timeout: 30m
    shell: bash
    run: |
      set -euo pipefail
      ./bin/server &
      sleep 2
      go test -tags=integration ./...

  - name: report
    dependsOn: [test, lint, build]
    when: always
    run: echo "CI complete"
