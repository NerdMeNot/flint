name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flint
          POSTGRES_USER: flint
          POSTGRES_PASSWORD: flint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests use this Postgres; without it they'd self-provision a
      # throwaway instance (see internal/core/engine TestMain). Step execution
      # is simulated or bufconn-faked in unit/integration tests; the real agent
      # path runs in the e2e job below.
      FLINT_TEST_DSN: postgres://flint:flint@localhost:5432/flint?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^web/'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Race detector — the engine's whole premise is concurrent workers over a
      # shared Postgres, so a data race is a correctness bug. Run separately so a
      # race failure is distinguishable from a plain test failure.
      - name: Test (race detector)
        run: go test -race ./...

  # The production path, end to end: control plane on a throwaway Postgres, a
  # REAL flint-agent in a privileged docker container supervising its bundled
  # containerd, executing a pipeline as actual containers — image pulls,
  # cross-step workspace handoff, service containers in a per-step CNI netns.
  e2e-agent:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: flint
          POSTGRES_USER: flint
          POSTGRES_PASSWORD: flint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLINT_TEST_DSN: postgres://flint:flint@localhost:5432/flint?sslmode=disable
      FLINT_CONTAINERD_E2E: "1"
      FLINT_CONTAINER_TOOL: docker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Live containerd validation
        run: go test ./internal/core/fleet/ -run TestContainerdLive -count=1 -v -timeout 20m
